<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leitor de Código de Barras para NF</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.3/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.68/vfs_fonts.js"></script>
    <link rel="stylesheet" href="style.css" />
    <script src="./main.js" defer></script>
    <link rel="icon" href="./images/Favicon.png" type="image/x-icon" />
  </head>

  <body>
    <div class="container">
      <header>
        <h1>Leitor de Código de Barras para NF</h1>
      </header>

      <main>
        <div class="my-form">
          <fieldset>
            <div class="coluns-three">
              <div class="input-wrapper">
                <label>Data e Hora Atuais:</label>
                <input type="text" id="dataHoraAtual" readonly />
              </div>

              <div class="input-wrapper">
                <label for="event-begin">Das</label>
                <input type="time" id="event-begin" />
              </div>

              <div class="input-wrapper">
                <label for="event-end">Ate</label>
                <input type="time" id="event-end" />
              </div>
            </div>
            <div class="input-wrapper">
              <label for="transportadora">Transportadora</label>
              <select id="transportadora" required>
                <option value="Mandae">Mandae</option>
                <option value="Correrios">Correios</option>
                <option value="Jamef">Jamef</option>
                <option value="Azul">Azul</option>
              </select>
              <!-- <p>Nome da Transportadora:</p>
              <input type="text" id="transportadora" required /> -->
            </div>
            <div class="input-wrapper">
              <label
                >Por favor, escaneie o código de barras da NF:
                <span id="contador-de-caracter"></span>
              </label>
              <input
                type="text"
                id="codigoDeBarras"
                onkeydown="if(event.keyCode === 13) lerCodigoDeBarras()"
              />
            </div>
          </fieldset>

          <fieldset>
            <legend>
              Total de Notas Fiscais Lidas:
              <span id="totalNotasFiscais">0</span>
            </legend>

            <h2>Dados das Notas Fiscais:</h2>
            <div class="table-wrapper">
              <table>
                <thead>
                  <tr>
                    <th class="codigo-barras">Código de Barras da NF</th>
                    <th class="transportadora">Transportadora</th>
                    <th class="volumes">Volumes</th>
                    <th>Opções</th>
                  </tr>
                </thead>
                <tbody id="tabelaNFs"></tbody>
              </table>
            </div>
          </fieldset>
        </div>
      </main>
      <footer>
        <button class="button" onclick="exportarParaXLS()">
          Salvar em XLS
        </button>
        <button class="button" onclick="exportarParaPDF()">
          Salvar em PDF
        </button>
      </footer>
    </div>

    <div class="login-page hidden">
      <div class="login-form">
        <h1>FACA O SEU LOGIN <span>:|</span></h1>

        <fieldset>
          <div class="input-wrapper">
            <label>usuario</label>
            <input type="text" id="userName" />
          </div>

          <div class="input-wrapper">
            <label>senha</label>
            <input type="password" id="password" />
          </div>
        </fieldset>

        <button id="button">
          <!-- onclick="validation(userName, password)" -->
          Entrar
        </button>
      </div>
    </div>
  </body>
</html>
